name: Verify Azure OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify subscription and demo resource group access
        shell: bash
        run: |
          set -euo pipefail
          az account show --query '{subscription:name, subscriptionId:id, tenantId:tenantId}' --output table
          az group show --name rg-concre-innova-demo --query '{name:name, location:location}' --output table
